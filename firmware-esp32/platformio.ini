; ==================================================================
; Sprint 0 — S0-FW-01
; Project: firmware-esp32 (Solar Battery IoT Gateway)
; Board:   ESP32-S3-DevKitC-1 (N16R8 — 16MB Flash, 8MB PSRAM)
; Tham chiếu: newiot.md §9.1, tasksprint.md S0-FW-01 + S1-FW-01..07
; ==================================================================

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include
lib_dir = lib
data_dir = data
test_dir = test

; ------------------------------------------------------------------
; Common settings — share giữa các env
; ------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time, colorize

; Build flags chung
build_flags =
    -DCORE_DEBUG_LEVEL=3                 ; 0=none .. 5=verbose
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -std=gnu++17
    -I src                                ; NI §9.1 đặt headers trong src/ cạnh .cpp

build_unflags =
    -std=gnu++11

; Libraries dùng cho cả flow IoT (mock + thật)
; Pin version để build reproducible.
lib_deps =
    knolleary/PubSubClient @ ^2.8                 ; MQTT client
    bblanchon/ArduinoJson @ ^7.1.0                ; JSON build/parse payload
    4-20ma/ModbusMaster @ ^2.0.1                  ; Modbus RTU master (RS485 đọc BMS)
    paulstoffregen/OneWire @ ^2.3.8               ; 1-Wire bus (DS18B20)
    milesburton/DallasTemperature @ ^3.11.0       ; DS18B20 driver
    adafruit/Adafruit INA219 @ ^1.2.3             ; cho prototype; INA226 dùng thư viện riêng
    robtillaart/INA226 @ ^0.6.0                   ; INA226 (current + voltage redundant)
    adafruit/Adafruit SHT31 Library @ ^2.2.2      ; SHT31 ambient temp/humidity
    adafruit/Adafruit BusIO @ ^1.16.1             ; transitive cho Adafruit drivers

; ------------------------------------------------------------------
; Env chính: ESP32-S3 DevKitC-1 (N16R8)
; ------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv     ; partition mặc định, S7 đổi sang OTA partition

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; Serial qua USB-CDC (DevKitC-1)
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"0.1.0-sprint1\"
    -DFW_BUILD_ENV=\"esp32-s3-devkitc-1\"

; ------------------------------------------------------------------
; Env example: chỉ blink + serial (S0-FW-02)
; Build: pio run -e example-blink
; ------------------------------------------------------------------
[env:example-blink]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/01-blink-hello/main.cpp>
lib_deps =                                    ; sketch blink không cần lib nào
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"0.1.0-example-blink\"

; ------------------------------------------------------------------
; Env native: chạy unit test trên laptop (Sprint 1 S1-FW-05)
; Build: pio test -e native -f test_payload
;
; Lý do: ArduinoJson + core::payload là pure C++ — test không cần ESP32.
;        Test ESP32-specific (WiFi, NTP, HTTPS) cần env khác (test_embedded)
;        — Sprint 3 sẽ thêm khi có CI runner gắn ESP32.
; ------------------------------------------------------------------
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DUNITY_INCLUDE_DOUBLE
    -I include
    -I src                                ; headers NI §9.1
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
build_src_filter =
    +<core/>
