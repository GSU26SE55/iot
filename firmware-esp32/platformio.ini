; ==================================================================
; Sprint 0 — S0-FW-01
; Project: firmware-esp32 (Solar Battery IoT Gateway)
; Board:   ESP32-S3-DevKitC-1 (N16R8 — 16MB Flash, 8MB PSRAM)
; Tham chiếu: newiot.md §9.1, tasksprint.md S0-FW-01 + S1-FW-01..07
; ==================================================================

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include
lib_dir = lib
data_dir = data
test_dir = test

; ------------------------------------------------------------------
; Common settings — share giữa các env
; ------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time, colorize

; Build flags chung
build_flags =
    -DCORE_DEBUG_LEVEL=5              ; 0=none .. 5=verbose
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -std=gnu++17
    -I src                                ; NI §9.1 đặt headers trong src/ cạnh .cpp

build_unflags =
    -std=gnu++11

; Libraries dùng cho cả flow IoT (mock + thật)
; Pin version để build reproducible.
lib_deps =
    knolleary/PubSubClient @ ^2.8                 ; MQTT client
    bblanchon/ArduinoJson @ ^7.1.0                ; JSON build/parse payload
    4-20ma/ModbusMaster @ ^2.0.1                  ; Modbus RTU master (RS485 đọc BMS)
    paulstoffregen/OneWire @ ^2.3.8               ; 1-Wire bus (DS18B20)
    milesburton/DallasTemperature @ ^3.11.0       ; DS18B20 driver
    adafruit/Adafruit INA219 @ ^1.2.3             ; cho prototype; INA226 dùng thư viện riêng
    robtillaart/INA226 @ ^0.6.0                   ; INA226 (current + voltage redundant)
    adafruit/Adafruit SHT31 Library @ ^2.2.2      ; SHT31 ambient temp/humidity
    adafruit/Adafruit BusIO @ ^1.16.1             ; transitive cho Adafruit drivers

; ------------------------------------------------------------------
; Env chính: ESP32-S3 DevKitC-1 (N16R8)
; ------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
; ⚠ Phải khai flash size ở CẢ board_build (header bootloader) LẪN board_upload
;   (esptool). Thiếu board_upload.* → bootloader và bảng phân vùng lệch nhau,
;   chip reset im lặng ngay trong bootloader, boot-loop vô hạn không log gì.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv     ; partition mặc định, S7 đổi sang OTA partition

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; Serial qua USB-CDC (DevKitC-1)
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"0.1.0-sprint4\"
    -DFW_BUILD_ENV=\"esp32-s3-devkitc-1\"
    ; Sprint 4 (S4-FW-01): PubSubClient default buffer 256 bytes — quá nhỏ cho
    ; production telemetry batch (~1.5KB). Đặt 4096 cho dư command payload.
    -DMQTT_MAX_PACKET_SIZE=4096
    -DMQTT_SOCKET_TIMEOUT=15

; ------------------------------------------------------------------
; Env example: chỉ blink + serial (S0-FW-02)
; Build: pio run -e example-blink
; ------------------------------------------------------------------
[env:example-blink]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/01-blink-hello/main.cpp>
lib_deps =                                    ; sketch blink không cần lib nào
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"0.1.0-example-blink\"

; ------------------------------------------------------------------
; Env native: chạy unit test trên laptop (Sprint 1 S1-FW-05)
; Build: pio test -e native -f test_payload
;
; Lý do: ArduinoJson + core::payload là pure C++ — test không cần ESP32.
;        Test ESP32-specific (WiFi, NTP, HTTPS) cần env khác (test_embedded)
;        — Sprint 3 sẽ thêm khi có CI runner gắn ESP32.
; ------------------------------------------------------------------
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DUNITY_INCLUDE_DOUBLE
    -I include
    -I src                                ; headers NI §9.1
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
build_src_filter =
    +<core/>
    +<net/backoff.cpp>             ; Sprint 3 test backoff
    +<cmd/cmd_logic.cpp>           ; Sprint 4 pure command decision logic
    +<bms/bms_register_map.cpp>    ; Sprint 5 BMS register decoder (pure)
    +<net/tls_ca.cpp>              ; GH-735 kiểm định dạng CA PEM (pure)
    +<core/reading_filter.cpp>     ; GH-740 lọc reading đã publish (pure)
    +<core/ingest_result.cpp>      ; GH-748 đọc kết quả nhận-một-phần (pure)

; ------------------------------------------------------------------
; Env uartlog: giống env chính nhưng Serial in ra UART0 (chân TX/RX qua
; cầu USB-UART) thay vì USB-CDC. Dùng khi cổng USB native im lặng và cần
; soi log boot để biết firmware chết ở đâu.
; Build: pio run -e esp32-s3-uartlog -t upload
; ------------------------------------------------------------------
; ------------------------------------------------------------------
; Env real-uartlog: đọc phần cứng thật (USE_MOCK_BMS=0) NHƯNG log vẫn ra
; UART0 (cổng CH343). Dùng suốt lúc lắp mạch — khỏi đổi cổng mỗi lần nạp.
; Build: pio run -e esp32-s3-real-uartlog -t upload --upload-port COM5
; ------------------------------------------------------------------
[env:esp32-s3-real-uartlog]
extends = env:esp32-s3-uartlog
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0-real-uartlog\"
    -DFW_BUILD_ENV=\"esp32-s3-real-uartlog\"
    -DMQTT_MAX_PACKET_SIZE=4096
    -DMQTT_SOCKET_TIMEOUT=15
    -DUSE_MOCK_BMS=0

; ------------------------------------------------------------------
; Env modbus-scan: gửi frame Modbus RTU chuẩn, quét baud và địa chỉ
; thanh ghi. Dùng khi firmware báo timeout 0xE2 mà dây đã đúng.
; Build: pio run -e esp32-s3-modbus-scan -t upload --upload-port COM5
; ------------------------------------------------------------------
[env:esp32-s3-modbus-scan]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/05-modbus-scan/main.cpp>
lib_deps =
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; ------------------------------------------------------------------
; Env i2c-scan: quét toàn bộ địa chỉ trên bus I2C GPIO8/9. Dùng khi
; INA226 và SHT3X cùng báo FAIL để biết bus có sống không.
; Build: pio run -e esp32-s3-i2c-scan -t upload --upload-port COM5
; ------------------------------------------------------------------
[env:esp32-s3-i2c-scan]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/06-i2c-scan/main.cpp>
lib_deps =
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; ------------------------------------------------------------------
; Env jk-probe: GỬI frame thăm dò sang BMS rồi nghe trả lời. Dùng khi
; sniffer thụ động im lặng nhưng chân TX của BMS đo được 3,3V.
; Build: pio run -e esp32-s3-jk-probe -t upload --upload-port COM5
; ------------------------------------------------------------------
[env:esp32-s3-jk-probe]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/04-jk-probe/main.cpp>
lib_deps =
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; ------------------------------------------------------------------
; Env uart-sniff: nghe trộm cổng UART của BMS, quét nhiều baud, in hex.
; Dùng để biết BMS có phát gì không trước khi viết parser JK-native.
; Build: pio run -e esp32-s3-uart-sniff -t upload --upload-port COM5
; ------------------------------------------------------------------
[env:esp32-s3-uart-sniff]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/03-uart-sniff/main.cpp>
lib_deps =
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; ------------------------------------------------------------------
; Env blink-uart: sketch tối giản, log ra UART0, không PSRAM.
; Dùng để tách biến: board/bootloader hỏng, hay app code hỏng.
; Build: pio run -e esp32-s3-blink-uart -t upload
; ------------------------------------------------------------------
[env:esp32-s3-blink-uart]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/01-blink-hello/main.cpp>
lib_deps =
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"blink\"
    -DFW_BUILD_ENV=\"blink-uart\"

; KHÔNG extends env chính — env chính ép PSRAM octal lên board định nghĩa N8
; no-PSRAM, gây panic lúc init rồi boot-loop. Env này tắt PSRAM hoàn toàn.
[env:esp32-s3-uartlog]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
; Phải khai flash size ở CẢ HAI chỗ. Thiếu board_upload.* thì bootloader
; và bảng phân vùng lệch nhau → chip reset im lặng, boot-loop vô hạn.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Firmware mount LittleFS. Thiếu dòng này thì `pio run -t uploadfs` đóng gói
; ảnh SPIFFS, chip ghi vào đúng partition nhưng firmware không đọc nổi và
; báo "CA cert KHÔNG tồn tại" dù file đã nằm trong data/.
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0           ; Serial = UART0, KHÔNG phải USB-CDC
    -DARDUINO_USB_MODE=1
    ; loop() chỉ có 8KB stack. Log verbose của HTTPClient gọi vsnprintf ngốn
    ; thêm vài KB ngay giữa đường TLS → chạm watchpoint cuối stack → panic
    ; "Unhandled debug exception". Tắt verbose là hết.
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0-uartlog\"
    -DFW_BUILD_ENV=\"esp32-s3-uartlog\"
    -DMQTT_MAX_PACKET_SIZE=4096
    -DMQTT_SOCKET_TIMEOUT=15

; ------------------------------------------------------------------
; Env real: ESP32-S3 với USE_MOCK_BMS=0 — build path hardware BMS thật.
; Để CI catch compile error trong modbus_bms + ina226 + ds18b20 + sht31 path.
; Build: pio run -e esp32-s3-real
; ------------------------------------------------------------------
[env:esp32-s3-real]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -UUSE_MOCK_BMS                ; undef trước để override
    -DUSE_MOCK_BMS=0              ; Sprint 5 real BMS path
