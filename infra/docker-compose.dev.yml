name: iot-dev

services:
  timescaledb:
    image: timescale/timescaledb:2.15.2-pg16
    container_name: iot-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: iot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: iot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # MQTT broker — Mosquitto (chọn thay EMQX để match backend Mqtt__Host=mosquitto + ACL file sẵn).
  # Bootstrap lần đầu: ./mqtt/mosquitto/bootstrap.sh → tạo passwd backend-bridge, copy password vào backend/.env.Docker.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"       # plain MQTT (dev)
      - "${MQTT_TLS_PORT:-8883}:8883"   # MQTT/TLS (S4 — uncomment listener trong mosquitto.conf khi có cert)
    volumes:
      - ./mqtt/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mqtt/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mqtt/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u backend-bridge -P $$(cat /mosquitto/config/passwd | head -1) -t '$$SYS/#' -C 1 -W 2 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb-data:
  redis-data:
  rabbitmq-data:
  mosquitto-data:
  mosquitto-log:
