# Sprint IoT-1 (#253) — Eclipse Mosquitto MQTT broker config.
# Đặt mosquitto + ACL trong cùng docker-compose của hệ thống (xem docker-compose.yml).

# ===== Listeners =====
# Cổng 1883 — plain MQTT. Bind 0.0.0.0 để batteryservice trong solar-net connect được.
# Host port (qua docker compose): 21883 cho dev (tránh clash iot-dev), 1883 cho prod.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ===== Persistence =====
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ===== Logging =====
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# ===== Limits =====
max_connections 1000
max_inflight_messages 50
# Sprint IoT-1: `message_size_limit` deprecated từ Mosquitto 2.0 — dùng max_packet_size.
max_packet_size 1048576

# ===== Retained / Will =====
retain_available true
max_queued_messages 1000

# ----- Cổng 8883 (MQTT/TLS) -----
# KHÔNG khai listener 8883 ở đây nữa (sửa 2026-07-31).
#
# Trước đây block này bị comment kèm ghi chú "UNCOMMENT khi đã đặt cert" — nghĩa là TLS chỉ bật
# được bằng thao tác TAY, và ai lỡ bỏ comment khi chưa có cert thì broker **fail to start**. Hệ quả
# thực tế: TLS không bao giờ được bật, cổng 8883 mở trong docker-compose nhưng không có ai nghe.
#
# Nay listener TLS nằm ở `conf.d/tls.conf` — file này do `scripts/gen-certs.sh` sinh ra CÙNG LÚC với
# cert. Chưa chạy gen-certs → không có file → broker chạy bình thường chỉ với 1883. Chạy gen-certs
# → có cert + có conf → restart là có 8883. Không còn bước sửa tay nào, không còn cách nào bật TLS
# mà thiếu cert.
#
# `include_dir` PHẢI nằm cuối file: trong Mosquitto, các tuỳ chọn đặt sau một `listener` sẽ áp cho
# chính listener đó. Đặt ở đây thì tls.conf tự khai đủ password_file/acl_file của riêng nó.
include_dir /mosquitto/config/conf.d
