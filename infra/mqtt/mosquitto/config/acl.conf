# Sprint IoT-1 (#253) — ACL phân quyền topic per-device.
#
# Mỗi device được cấp username = device_code (vd "ESP32-001") + password ngẫu nhiên.
# ACL dùng pattern %u = username để 1 file áp cho mọi device:
#   - telemetry/{deviceCode} → device write, backend read.
#   - heartbeat/{deviceCode} → device write, backend read.
#   - status/{deviceCode}    → device write (LWT), backend read.
#   - cmd/{deviceCode}       → backend write, device read (downlink: config/OTA trigger).

# ===== Per-device topics (sử dụng %u = username = deviceCode) =====
pattern write telemetry/%u
pattern write heartbeat/%u
pattern write status/%u
pattern read  cmd/%u

# ===== Backend bridge user "backend-bridge" — full read/write =====
user backend-bridge
topic readwrite telemetry/#
topic readwrite heartbeat/#
topic readwrite status/#
topic readwrite cmd/#
