# ==================================================================
# Sprint 4 — S4-INF-03 (#38): ACL phân quyền topic per-device
# Sprint 4 — S4-INF-04 (#39): backend-bridge full-topic user
#
# Schema topic theo backend MqttTopicMap (overall.md §52.14):
#   solar/{deviceCode}/{batterySerial}/telemetry  — device → backend (per pin)
#   solar/{deviceCode}/heartbeat                  — device → backend
#   solar/{deviceCode}/status                     — device → backend (LWT)
#   solar/{deviceCode}/cmd                        — backend → device (downlink)
#   solar/{deviceCode}/cmd/ack                    — device → backend (ack)
#
# Username convention:
#   - Device: username = deviceCode lower-case (backend IotApiKeyService
#     .GenerateMqttCredential() → deviceCode.ToLowerInvariant()).
#   - Bridge: username = "backend-bridge" (đặt qua bootstrap.sh).
#
# Pattern syntax (Mosquitto):
#   pattern write <topic>   — allow publish; %u expand thành username.
#   pattern read  <topic>   — allow subscribe.
#   `+` single-level wildcard, `#` multi-level (chỉ cuối topic).
# ==================================================================

# ===== Per-device topics (pattern, áp cho mọi device username) =====
# Telemetry — device publish cho từng pin (batterySerial ở segment 3).
pattern write solar/%u/+/telemetry

# Heartbeat — device publish health check.
pattern write solar/%u/heartbeat

# Status — device publish "online"/"offline" (LWT cũng dùng topic này).
pattern write solar/%u/status

# Command ack — device publish ack sau khi exec downlink.
pattern write solar/%u/cmd/ack

# Command downlink — device subscribe. KHÔNG cho write để chặn spoofing
# (1 device không gửi cmd cho device khác).
pattern read  solar/%u/cmd

# ===== Luật riêng cho ESP-2 =====
# Cần vì DEVICE_CODE trong firmware là "ESP-2" IN HOA nên topic là
# solar/ESP-2/..., trong khi username Mosquitto là "esp-2" chữ thường.
# Pattern %u ở trên chỉ khớp chữ thường nên không phủ được, phải khai tay.
user esp-2
topic write solar/ESP-2/+/telemetry
topic write solar/ESP-2/heartbeat
topic write solar/ESP-2/status
topic write solar/ESP-2/cmd/ack
topic read  solar/ESP-2/cmd

# ===== Backend bridge — user duy nhất có quyền full solar/# =====
# Subscribe + publish toàn bộ tree để bridge nhận tele/hb/status/cmd-ack
# và gửi downlink solar/+/cmd.
user backend-bridge
topic readwrite solar/#
topic read $SYS/#
