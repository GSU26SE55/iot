<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Signal / Power Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Base App Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Outer Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- ==================== LEFT: ESP MCU ==================== -->
  <!-- Chip Body -->
  <rect x="76" y="156" width="130" height="200" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="7"/>

  <!-- ESP Metal Shield -->
  <rect x="96" y="210" width="90" height="120" rx="8" fill="#334155" stroke="#64748b" stroke-width="4"/>

  <!-- PCB Antenna Traces -->
  <path d="M96 185 h20 v-16 h24 v16 h24 v-16 h22" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MCU Pins Left -->
  <line x1="56" y1="190" x2="76" y2="190" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="56" y1="225" x2="76" y2="225" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="56" y1="260" x2="76" y2="260" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="56" y1="295" x2="76" y2="295" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="56" y1="330" x2="76" y2="330" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- Status LED -->
  <circle cx="112" cy="230" r="4" fill="#38bdf8"/>

  <!-- ==================== CENTER: CONNECTION BRIDGE ==================== -->
  <!-- Data / Power Flow Lines -->
  <path d="M206 230 C240 230, 260 230, 290 230" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="6 6"/>
  <path d="M206 282 C240 282, 260 282, 290 282" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="6 6"/>

  <!-- Active Link Node (Pulsing Energy Hub) -->
  <circle cx="251" cy="256" r="22" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6"/>
  <circle cx="251" cy="256" r="8" fill="#10b981"/>

  <!-- ==================== RIGHT: BATTERY ==================== -->
  <!-- Battery Body -->
  <rect x="296" y="166" width="130" height="180" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="7"/>

  <!-- Battery Terminal -->
  <rect x="426" y="226" width="14" height="60" rx="5" fill="#10b981"/>

  <!-- Charge Indicator (3 Level Bars) -->
  <rect x="314" y="186" width="22" height="140" rx="6" fill="#10b981" opacity="0.9"/>
  <rect x="344" y="186" width="22" height="140" rx="6" fill="#10b981" opacity="0.9"/>
  <rect x="374" y="186" width="22" height="140" rx="6" fill="#10b981" opacity="0.4"/>

  <!-- Bolt Emblem in Battery -->
  <path d="M362 236 l-14 24 h12 l-4 22 18 -26 h-12 z" fill="#f8fafc"/>
</svg>
